name: CI

on:
  push:
    branches: [assessment-core, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: lint · types · test · eval · build
    runs-on: ubuntu-latest
    # No secrets and no network: the app, tests, and the eval suite all run on
    # the deterministic in-memory dataset + MockProvider.
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm eval
      - run: pnpm build
