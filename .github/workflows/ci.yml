name: CI

on:
  push:
    branches: [main]
  pull_request:

# One in-flight run per ref; a new push cancels the previous.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: format · lint · types · test · eval · build
    runs-on: ubuntu-latest
    # No secrets: tests and the eval suite run on the deterministic
    # InMemoryHiringDataSource + MockProvider (no DB, no network). The Prisma
    # client is constructed lazily, so `build` never needs a connection string.
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # runs postinstall -> `prisma generate` (env-free)
      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm eval
      - run: pnpm build
